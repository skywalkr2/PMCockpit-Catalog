# The PM Cockpit packs catalog: the file the app's Add-ons screen reads (PM Cockpit design 3.11).
# Release builds of the app read it from this file's raw address on the main branch.
#
# Each entry is shown to people as plain text. The app writes what a pack adds, reaches and keeps from `provides`
# and `requires`, so copy those from the pack's plugin.yaml exactly; its AI costs are priced from `ai_jobs` on each
# person's own accounts. See the README for every field and the rules for being listed.
version: 1
packs:
  - id: google
    name: Google mail and calendar
    summary: Lets the assistant keep reading your Gmail (your sent mail too) and Google Calendar, and act on them only after your yes on that exact change. It signs in as you on Google's own page.
    publisher: &publisher skywalkr2   # the publisher, set once here for both packs
    maintainers: true
    updated: "2026-10-28"
    version: 0.2.0
    plugin_api: ">=0.3.92,<0.4"
    release:
      url: https://raw.githubusercontent.com/skywalkr2/PMCockpit-Catalog/main/releases/pm_cockpit_mail_calendar-0.2.0-py3-none-any.whl
      sha256: 33e967fe6fb1bdca41aac2a7f883335d42322d8b6e59ba1760be9e12f3a4139c
    price:
      model: see_publisher
    install: "Install it from the Add-ons screen, or download its .whl file from this catalog's releases folder, then: cockpit install <the file>"
    demo: false
    provides:
      sign_ins: [google/account]
      connectors: [google/calendar, google/mail]
      connector_reads: {google/calendar: calendar, google/mail: mail}
      channels: [google/mail-channel, google/calendar-channel]
      triage_matchers: [google/mailing-lists, google/automatic-replies, google/answers-only]
      help: [help.md]
    requires:
      network: [accounts.google.com, oauth2.googleapis.com, www.googleapis.com, gmail.googleapis.com]
      secrets: [client-id, client-secret]
      data_levels: [open, internal]
      tools: []
  - id: microsoft
    name: Microsoft Outlook mail and calendar
    summary: Lets the assistant keep reading your Outlook mail (your sent mail too) and calendar, and act on them only after your yes on that exact change. It signs in as you on Microsoft's own page.
    publisher: *publisher
    maintainers: true
    updated: "2026-10-28"
    version: 0.2.0
    plugin_api: ">=0.3.92,<0.4"
    release:
      url: https://raw.githubusercontent.com/skywalkr2/PMCockpit-Catalog/main/releases/pm_cockpit_mail_calendar-0.2.0-py3-none-any.whl
      sha256: 33e967fe6fb1bdca41aac2a7f883335d42322d8b6e59ba1760be9e12f3a4139c
    price:
      model: see_publisher
    install: "Install it from the Add-ons screen, or download its .whl file from this catalog's releases folder, then: cockpit install <the file>"
    demo: false
    provides:
      sign_ins: [microsoft/account]
      connectors: [microsoft/calendar, microsoft/mail]
      connector_reads: {microsoft/calendar: calendar, microsoft/mail: mail}
      channels: [microsoft/mail-channel, microsoft/calendar-channel]
      triage_matchers: [microsoft/mailing-lists, microsoft/automatic-replies, microsoft/answers-only]
      help: [help.md]
    requires:
      network: [login.microsoftonline.com, graph.microsoft.com]
      secrets: [client-id]
      data_levels: [open, internal]
      tools: []
