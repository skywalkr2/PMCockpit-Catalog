name: check

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Let git read PM Cockpit's repository while it is private
        # A fine-grained token with read-only Contents access to that one repository, kept as this repository's
        # Actions secret HOST_READ_TOKEN. Once PM Cockpit's repository is public, delete the secret: nothing else
        # changes. Pull requests from forks get no secrets, so for them this step does nothing.
        env:
          HOST_READ_TOKEN: ${{ secrets.HOST_READ_TOKEN }}
        run: |
          if [ -n "$HOST_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${HOST_READ_TOKEN}@github.com/skywalkr2/ProjectManagementAgent".insteadOf "https://github.com/skywalkr2/ProjectManagementAgent"
          fi
      - name: Install PM Cockpit (without its web screens)
        env:
          PM_COCKPIT_WITHOUT_SCREENS: "1"
        run: |
          uv venv --clear
          uv pip install "pm-cockpit @ git+https://github.com/skywalkr2/ProjectManagementAgent@claude/tender-tesla-16a8ob"
      - name: Read the catalog as the app does
        run: uv run --no-project python check.py
